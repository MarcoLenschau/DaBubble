name: Deploy to SSH Server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
jobs:
  build:
    name: Build DaBubble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⚙️ Install Angular CLI
        run: npm install -g @angular/cli

      - name: Create environments folder
        run: mkdir src/envenvironments

      - name: Generate environment.ts from secrets
        run: |
          echo "export const environment = {
            firebase: {
              projectId: '${{ env.PROJECT_ID }}',
              appId: '${{ env.APP_ID }}',
              storageBucket: '${{ env.STORAGE_BUCKET }}',
              apiKey: '${{ secrets.API_KEY }}',
              authDomain: '${{ env.AUTH_DOMAIN }}',
              messagingSenderId: '${{ env.MESSAGING_SENDER_ID }}'
            }
          };" > src/envenvironments/environment.ts

      - name: 🔨 Build Angular App
        run: ng build --configuration production --base-href="/"
 
      - name: Build Docker image
        run: |
          docker build -t cordova .
 
      - name: Create app folder
        run: |
          mkdir /app
          mkdir /app/www
          cp mobile-app/config.yml /app/
          cp dist/dabubble/browser/* /app/www/

      - name: Run container
        run: |
          docker run -v /app:/app cordova

      - name: Copy files via SCP
        uses: appleboy/scp-action@v1
        with:
          host: marco-lenschau.de
          username: github
          key: ${{ secrets.SECRET_KEY }}
          port: 22
          source: "dist/dabubble/browser/*"
          target: "/var/www/html/dabubble/"
          strip_components: 3

      - name: Copy apk file via SCP
        uses: appleboy/scp-action@v1
        with:
          host: marco-lenschau.de
          username: github
          key: ${{ secrets.SECRET_KEY }}
          port: 22
          source: "app/apk/app.apk"
          target: "/var/www/html/dabubble/"
          strip_components: 2